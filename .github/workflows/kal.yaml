name: PR golangci-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Remove all permissions from GITHUB_TOKEN except metadata.
permissions: {}

jobs:
  golangci:
    name: kube-api-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # tag=v4.2.2
        name: Checkout code
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # tag=v7.0.0
        with:
          go-version: 1.26
      - name: Install Golang CI Lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.0
      - name: Build KAL
        run: golangci-lint custom
      - name: run api linter
        run: ./bin/golangci-kube-api-linter run -c ./.golangci-kal.yml ./...
