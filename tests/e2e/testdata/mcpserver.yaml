apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-everything
  namespace: e2e-test-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-everything
  template:
    metadata:
      labels:
        app: mcp-everything
    spec:
      containers:
        - name: mcp-everything
          image: us-central1-docker.pkg.dev/k8s-staging-images/agentic-net/quickstart-everything-mcp:main
          # Image is built and loaded into the kind cluster by the E2E setup
          # (build_and_load_mcp_everything_image in dev/ci/lib.sh), so prefer the local
          # copy rather than pulling from the staging registry.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-everything-svc
  namespace: e2e-test-ns
spec:
  type: ClusterIP
  selector:
    app: mcp-everything
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
