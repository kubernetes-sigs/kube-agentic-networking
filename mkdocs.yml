site_name: Kubernetes Agentic Networking
site_url: https://kube-agentic-networking.sigs.k8s.io/
site_description: >-
  Standardized Kubernetes APIs for secure, governed communication between
  AI agents, tools, and LLMs — built on Gateway API.
repo_url: https://github.com/kubernetes-sigs/kube-agentic-networking
repo_name: kubernetes-sigs/kube-agentic-networking
site_dir: site
docs_dir: site-src
extra_css:
  - stylesheets/extra.css
hooks:
  - hack/docs/generate-proposal-landing-pages.py
  - hack/docs/mkdocs-copy-proposals.py
watch:
  - docs/proposals
theme:
  name: material
  icon:
    repo: fontawesome/brands/git-alt
  logo: images/logo/kubernetes-logo.png
  favicon: images/favicon-64.png
  features:
    - search.highlight
    - navigation.tabs
    - navigation.top
    - navigation.expand
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
edit_uri: edit/main/site-src/
plugins:
  - search
  - awesome-pages
  - mermaid2
markdown_extensions:
  - admonition
  - md_in_html
  - meta
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - toc:
      permalink: true
  - tables
